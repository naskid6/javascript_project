<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
    }
    .todo-grid,.todo-input-grid
    {
      display: grid;
      grid-template-columns: 200px 150px 100px;
      column-gap: 10px;
      row-gap: 10px;
      align-items: center;
    }
    .todo-input-grid{
      margin-bottom: 10px;
      align-items: stretch;
    }
  
    .name-input,.due-date-input{
      font-size: 15px;
      padding: 6px;

    }
    .add-todo-button{
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }
    .delete-todo-button{
      background-color: darkred;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 15px;
      padding-top: 10px;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
<p>Todo Practices</p>
<div class="todo-input-grid ">
<input type="text" class="js-input name-input" placeholder="Todo name">
<input type="date" class="js-due-date  due-date-input">
<button class="add-todo-button js-add-button">Add</button>
</div>
<div class="inputValue todo-grid"></div>


<script>

  const todoList=[{name:'Wash Plate',dueDate:'2026-04-11'},{name:'Cook the Food',dueDate:'2026-04-12'},{name:'Dish the Food',dueDate:'2026-04-1'}]

  document.querySelector('.js-add-button').addEventListener('click',()=>{
    addTodoList()
  })
  renderTodoList()
  function renderTodoList(){
  let todoListHtml=''
todoList.forEach(function(TodoObject,index){
const {name,dueDate}=TodoObject


  const html=`<div>${name}</div>
              <div>${dueDate}</div>
             <button
  
    "    class="delete-todo-button js-delete-button">Delete</button>`
  todoListHtml+=html
})

document.querySelector('.inputValue').innerHTML=todoListHtml

document.querySelectorAll('.js-delete-button')
.forEach((deleteButton,index)=>{
  deleteButton.addEventListener('click',()=>{
    todoList.splice(index,1)
    renderTodoList()
  
  })
  
})
  }


  function addTodoList(){
    const todo=document.querySelector('.js-input')
      const inputValue=document.querySelector('.js-due-date')
 const dueDate=inputValue.value 
    const name=todo.value 
    todoList.push({name,dueDate})
  renderTodoList()
  
    todo.value=''
  }
</script>
</body>


</html>
