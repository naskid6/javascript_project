
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body { background: #0099ff; font-family: Arial; display: flex; justify-content: center; padding: 20px; }
    .chat-box { background: white; width: 400px; border-radius: 12px; overflow: hidden; }
    .header { background: #007bff; color: white; text-align: center; padding: 15px; font-size: 24px; font-weight: bold; }
    #name { width: calc(100% - 20px); margin: 10px; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
    #messages { height: 400px; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: #f8f9fa; }
    .mine { background: #007bff; color: white; align-self: flex-end; padding: 8px 12px; border-radius: 15px; max-width: 80%; }
    .others { background: #e9ecef; color: black; align-self: flex-start; padding: 8px 12px; border-radius: 15px; max-width: 80%; }
    .bottom { display: flex; gap: 5px; padding: 10px; }
    #msg { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
    button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>

<div class="chat-box">
  <div class="header">CHAT APP</div>

  <input id="name" placeholder="Your name">

  <div id="messages"></div>

  <div class="bottom">
    <input id="msg" placeholder="Type a message...">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDbINjCAM5-Xbz-xX4jaAvRVeaX-KoDJXE",
  authDomain: "chat-app-881f8.firebaseapp.com",
  projectId: "chat-app-881f8",
  storageBucket: "chat-app-881f8.firebasestorage.app",
  messagingSenderId: "727888992314",
  appId: "1:727888992314:web:4e8ad878e89af672893d03",
  measurementId: "G-E0ZWB9QLY5"
  };;

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function sendMsg() {
    let name = document.getElementById("name").value;
    let msg = document.getElementById("msg").value;
    if (name == "" || msg == "") return;

    db.collection("messages").add({
      name: name,
      text: msg,
      time: new Date()
    });

    document.getElementById("msg").value = "";
  }

  db.collection("messages").orderBy("time").onSnapshot((snapshot) => {
    let box = document.getElementById("messages");
    box.innerHTML = "";

    // First person wey ever send message
    let firstPerson = "";
    if (snapshot.docs.length > 0) {
      firstPerson = snapshot.docs[0].data().name;
    }

    snapshot.forEach((doc) => {
      let data = doc.data();
      if (data.name == firstPerson) {
        box.innerHTML += "<div class='mine'>" + data.text + "</div>";
      } else {
        box.innerHTML += "<div class='others'><b>" + data.name + ":</b> " + data.text + "</div>";
      }
    });
    box.scrollTop = box.scrollHeight;
  });
</script>

</body>
</html>
