<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="Calculator.css">
</head>
<body>
  <div class="preview">
    <input type="text" class="js-input" placeholder="0">
    <div class="btn-container">
      <button class="btn-one">%</button>
      <button class="btn-clear">C</button>
      <button class="btn-one">*</button>
      <button class="btn-one">/</button>
      <button class="btn-one">1</button>
      <button class="btn-one">2</button>
      <button class="btn-one">3</button>
      <button class="btn-one">4</button>
      <button class="btn-one">5</button>
      <button class="btn-one">6</button>
      <button class="btn-one">7</button>
      <button class="btn-one">8</button>
      <button class="btn-one">9</button>
      <button class="btn-one">0</button>
      <button class="btn-one">.</button>
      <button class="btn-one">+</button>
      <button class="btn-one">-</button>
      <button class="btn-equal">=</button>
      <button class="btn-cancel">X</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.1/math.min.js"></script>
<script src="testing.js"></script>
  <script src="Calculator.js"></script>
</body>
</html>
