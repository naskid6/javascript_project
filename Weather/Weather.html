
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">

        <div class="header">
            <h1>Weather Explorer</h1>
            <p class="first-p">Stay Updated With The Weather Conditions</p>
        </div>

        <div class="search-container">
            <input
                type="text"
                class="js-input"
                placeholder="Enter city name"
            >
            <button class="js-btn">Search</button>
        </div>

        <div class="weather-container">
            <h2 class="js-city">City Name</h2>
            <h1 class="js-temp">--°C</h1>
            <p class="js-desc">Weather description</p>

            <div class="weather-details">
                <div>
                    <p>Temperature</p>
                    <h3 id="temp">--°C</h3>
                </div>

                <div>
                    <p>Weather</p>
                    <h3 id="weather">--</h3>
                </div>

                <div>
                    <p>Wind Speed</p>
                    <h3 id="wind">--</h3>
                </div>
            </div>
        </div>

        <div class="forecast-container">
            <h2>Weather Forecast</h2>

            <div class="forecast-cards">
                <div class="forecast-card">
                    <p class="day">Monday</p>
                    <h3>--°C</h3>
                    <p>--</p>
                </div>

                <div class="forecast-card">
                    <p class="day">Tuesday</p>
                    <h3>--°C</h3>
                    <p>--</p>
                </div>

                <div class="forecast-card">
                    <p class="day">Wednesday</p>
                    <h3>--°C</h3>
                    <p>--</p>
                </div>

                <div class="forecast-card">
                    <p class="day">Thursday</p>
                    <h3>--°C</h3>
                    <p>--</p>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
